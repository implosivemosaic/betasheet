# Beta Sheet (betasheet.ca), formerly climb-ontario-keith.fly.dev. Single Machine/SQLite volume; no HA replica.
app = "climb-ontario-keith"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "betasheet.ca"
  CONTACT_EMAIL = "hello@betasheet.ca"
  PORT = "8080"
  DATABASE_PATH = "/data/catalogue.db"
  POOL_SIZE = "5"

[[mounts]]
  source = "catalogue_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"
  [http_service.checks.headers]
    X-Forwarded-Proto = "https"

# No release_command: migrations run on the volume-bearing Machine at boot.
# Deploy with --ha=false; do not scale SQLite horizontally.
